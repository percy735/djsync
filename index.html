<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>DJ SYNC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Mono&display=swap');
:root{--bg:#050508;--c1:#00ffe1;--c2:#ff2d6b;--c3:#ffe533;--muted:rgba(255,255,255,0.3);--dim:rgba(255,255,255,0.06);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;color:#e0e0f0;font-family:'DM Mono',monospace;overflow:hidden;}
.screen{display:none;width:100%;height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.screen.active{display:flex;}

/* VIDEO always behind */
#video-layer{position:fixed;inset:0;z-index:1;background:#000;display:none;}
#video-layer.playing{display:block;}
#yt-player{width:100%;height:100%;border:none;}

/* UI on top */
#ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;}
#video-hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent);display:flex;justify-content:space-between;align-items:flex-start;opacity:0;transition:opacity 0.6s;pointer-events:none;}
#video-hud.show{opacity:1;}
.vhud-now{font-size:.5rem;letter-spacing:3px;color:var(--c1);margin-bottom:3px;}
.vhud-title{font-family:'Orbitron',sans-serif;font-size:clamp(.9rem,3vw,1.5rem);color:#fff;letter-spacing:2px;max-width:65vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vhud-artist{font-size:.65rem;color:var(--c1);letter-spacing:2px;margin-top:2px;}
#scan-indicator{position:absolute;bottom:20px;right:20px;background:rgba(0,0,0,0.7);border:1px solid var(--c1);color:var(--c1);font-size:.55rem;letter-spacing:3px;padding:6px 14px;opacity:0;transition:opacity 0.4s;pointer-events:none;}
#scan-indicator.show{opacity:1;}
#song-flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);opacity:0;transition:opacity 0.4s;pointer-events:none;gap:10px;}
#song-flash.show{opacity:1;}
.flash-check{font-size:2.5rem;color:var(--c1);}
.flash-title{font-family:'Orbitron',sans-serif;font-size:clamp(1.2rem,5vw,2.5rem);color:#fff;letter-spacing:2px;text-align:center;max-width:85vw;}
.flash-artist{font-size:clamp(.8rem,2vw,1rem);color:var(--c1);letter-spacing:4px;}

/* SETUP */
#screen-setup{background:radial-gradient(ellipse at top,#0a0a1a 0%,#000 70%);z-index:20;pointer-events:all;}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.5rem,10vw,4rem);letter-spacing:8px;color:var(--c1);text-shadow:0 0 40px rgba(0,255,225,.5);text-align:center;margin-bottom:6px;}
.logo-sub{font-size:.6rem;letter-spacing:4px;color:var(--muted);text-align:center;margin-bottom:28px;}
.card{width:100%;max-width:480px;background:rgba(255,255,255,0.03);border:1px solid rgba(0,255,225,0.1);padding:20px;margin-bottom:12px;}
.card-title{font-size:.55rem;letter-spacing:4px;color:var(--c1);margin-bottom:12px;text-transform:uppercase;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.55rem;letter-spacing:3px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.slider-wrap{display:flex;align-items:center;gap:12px;}
.slider-wrap input[type=range]{flex:1;accent-color:var(--c1);}
.slider-num{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--c1);min-width:40px;text-align:right;}
.btn{width:100%;max-width:480px;padding:16px;background:transparent;border:2px solid var(--c1);color:var(--c1);font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:5px;cursor:pointer;position:relative;overflow:hidden;transition:color .3s;margin-top:8px;pointer-events:all;}
.btn::before{content:'';position:absolute;inset:0;background:var(--c1);transform:translateX(-101%);transition:transform .3s;z-index:0;}
.btn:active::before{transform:translateX(0);}
.btn:active{color:#000;}
.btn span{position:relative;z-index:1;}
.btn.sec{border-color:rgba(255,255,255,0.15);color:var(--muted);font-size:.7rem;margin-top:6px;}

/* LISTEN */
#screen-listen{background:radial-gradient(ellipse at center,#080812 0%,#000 70%);gap:20px;position:relative;overflow:hidden;z-index:15;pointer-events:all;}
#screen-listen::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,225,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,225,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
.listen-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.5rem,12vw,7rem);letter-spacing:8px;color:var(--c1);animation:glow 2.5s ease-in-out infinite;text-align:center;position:relative;}
@keyframes glow{0%,100%{text-shadow:0 0 30px rgba(0,255,225,.3);}50%{text-shadow:0 0 80px rgba(0,255,225,.8);}}
.bars{display:flex;align-items:flex-end;gap:3px;height:60px;}
.bar{width:5px;border-radius:3px;background:var(--c1);opacity:.4;}
.listen-status{font-size:.65rem;letter-spacing:4px;color:var(--muted);text-align:center;position:relative;}
.last-song{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,255,225,0.05);border:1px solid rgba(0,255,225,0.15);padding:10px 20px;text-align:center;width:90%;max-width:400px;}
.last-song-label{font-size:.5rem;letter-spacing:3px;color:var(--muted);}
.last-song-title{font-family:'Orbitron',sans-serif;font-size:.85rem;color:var(--c1);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.countdown{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(5rem,22vw,10rem);color:rgba(0,255,225,0.06);position:absolute;bottom:0;left:0;right:0;text-align:center;pointer-events:none;}
.settings-btn{position:fixed;top:14px;right:14px;background:rgba(0,0,0,0.6);border:1px solid var(--dim);color:var(--muted);font-size:.6rem;letter-spacing:2px;padding:6px 12px;cursor:pointer;z-index:100;font-family:'DM Mono',monospace;pointer-events:all;}

/* LOG — debug visible on screen */
#log{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(0,0,0,0.85);padding:8px 12px;font-size:.6rem;letter-spacing:1px;color:rgba(0,255,225,0.7);max-height:80px;overflow:hidden;pointer-events:none;border-top:1px solid rgba(0,255,225,0.1);}

/* TOAST */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.95);border:1px solid var(--c1);color:var(--c1);font-size:.65rem;letter-spacing:2px;padding:10px 24px;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{border-color:var(--c2);color:var(--c2);}
#toast.warn{border-color:var(--c3);color:var(--c3);}
#toast.ok{border-color:var(--c1);color:var(--c1);}
</style>
</head>
<body>

<div id="video-layer">
  <iframe id="yt-player" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
</div>

<div id="ui-layer">
  <div id="video-hud">
    <div>
      <div class="vhud-now">● SONANDO AHORA</div>
      <div class="vhud-title" id="vhud-title">—</div>
      <div class="vhud-artist" id="vhud-artist">—</div>
    </div>
  </div>
  <div id="scan-indicator">⟳ ESCANEANDO...</div>
  <div id="song-flash">
    <div class="flash-check">✓</div>
    <div class="flash-title" id="flash-title">—</div>

<!-- SETUP -->
<div id="screen-setup" class="screen active">

  <div class="card">

    <div class="field">

  <div class="last-song" id="last-song" style="display:none;">
    <div class="last-song-label">ÚLTIMA CANCIÓN</div>

  </div>
  <div class="countdown" id="countdown">—</div>
</div>

<div id="log"></div>
<div id="toast"></div>

<script>
const CFG={
  acrHost:'identify-us-west-2.acrcloud.com',
  acrKey:'b1723d15c8437cec4d27d41aaccd469e',
  acrSecret:'DCkpN9bQ1OD8Utd2TRiYaVVPamWyhFDchcdcW7JE',
  ytKey:'AIzaSyC-FH2-T-z6IU40cB3P70qisbtIqw-MRUw',
  interval:20,
};

let audioStream=null,audioCtx=null,analyser=null;
let countTimer=null,hudTimer=null;
let lastSong='',isVideoPlaying=false,isScanning=false,animGoing=false;

// ── LOG ──
function log(msg,type=''){
  const el=document.getElementById('log');
  const time=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  el.textContent=`[${time}] ${msg}`;
  console.log(msg);
  if(type)toast(msg,type);
}

// ── SCREENS ──
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-'+id);
  if(el)el.classList.add('active');
}

// ── START ──
async function startApp(){
  CFG.interval=parseInt(document.getElementById('scan-interval').value);
  log('Iniciando... pidiendo micrófono');
  await initMic();
  showScreen('listen');
  buildBars();
  startCycle();
}

// ── MIC ──
async function initMic(){
  try{
    audioStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
    });
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    audioCtx.createMediaStreamSource(audioStream).connect(analyser);
    log('✓ Micrófono activo','ok');
  }catch(e){
    log('✗ Sin micrófono: '+e.message,'warn');
  }
}

// ── BARS ──
function buildBars(){
  const w=document.getElementById('bars');w.innerHTML='';
  for(let i=0;i<32;i++){const b=document.createElement('div');b.className='bar';b.style.height='6px';w.appendChild(b);}
  if(!animGoing){animGoing=true;animLoop();}
}
function animLoop(){
  const bars=document.querySelectorAll('.bar');
  if(analyser&&bars.length){
    const d=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(d);
    bars.forEach((b,i)=>{const v=d[Math.floor(i*d.length/bars.length)];b.style.height=(5+(v/255)*55)+'px';b.style.opacity=0.2+(v/255)*0.8;});
  }else{
    bars.forEach(b=>{b.style.height=(5+Math.random()*30)+'px';});
  }
  requestAnimationFrame(animLoop);
}

// ── CYCLE ──
function startCycle(){
  clearInterval(countTimer);
  let secs=CFG.interval;
  document.getElementById('countdown').textContent=secs;
  document.getElementById('listen-status').textContent='ESCUCHANDO...';
  countTimer=setInterval(()=>{
    secs--;
    if(!isVideoPlaying)document.getElementById('countdown').textContent=secs;
    if(secs<=0){clearInterval(countTimer);doScan();}
  },1000);
}

// ── SCAN ──
async function doScan(){
  if(isScanning){log('Ya escaneando, skip');return;}
  isScanning=true;
  if(isVideoPlaying)document.getElementById('scan-indicator').classList.add('show');
  else document.getElementById('listen-status').textContent='IDENTIFICANDO...';

  try{
    log('Grabando 8 segundos de audio...');
    let title,artist,ytId;

    if(audioStream){
      const result=await recordAndRecognize();
      title=result.title;
      artist=result.artist;
      ytId=result.ytVideoId?[result.ytVideoId]:null;
      log(`ACRCloud: "${title}" — ${artist}`,'ok');
    }else{
      // Demo mode
      const demos=[{title:'Blinding Lights',artist:'The Weeknd'},{title:'Flowers',artist:'Miley Cyrus'},{title:'Levitating',artist:'Dua Lipa'}];
      const d=demos[Math.floor(Math.random()*demos.length)];
      title=d.title;artist=d.artist;
      await sleep(2000);
      log(`Demo: "${title}" — ${artist}`);
    }

    document.getElementById('scan-indicator').classList.remove('show');
    const key=`${artist}__${title}`;
    if(key===lastSong){
      log('Misma canción — sin cambios');
      isScanning=false;
      startCycle();
      return;
    }
    lastSong=key;

    log(`Buscando video: ${artist} - ${title}`);
    if(!ytId)ytId=await searchYT(title,artist);
    if(!ytId||!ytId.length){
      log('Sin video en YouTube','warn');
      isScanning=false;
      if(!isVideoPlaying)startCycle();
      else startCycle();
      return;
    }

    log(`Verificando embed para ${ytId.length} videos...`);
    await playVideo(ytId,title,artist);

  }catch(e){
    log('Error: '+e.message,'err');
    document.getElementById('scan-indicator').classList.remove('show');
    if(!isVideoPlaying)document.getElementById('listen-status').textContent='ESCUCHANDO...';
  }

  isScanning=false;
  startCycle();
}

// ── RECORD + ACRCLOUD ──
async function recordAndRecognize(){
  const chunks=[];
  const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']
    .find(m=>MediaRecorder.isTypeSupported(m))||'';
  log('Formato audio: '+(mime||'default'));
  const rec=new MediaRecorder(audioStream,mime?{mimeType:mime}:{});
  rec.ondataavailable=e=>e.data.size>0&&chunks.push(e.data);
  rec.start(1000); // collect every 1s
  await sleep(8000);
  rec.stop();
  await new Promise(r=>rec.onstop=r);
  const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
  log('Audio grabado: '+Math.round(blob.size/1024)+'KB');

  const ts=Math.floor(Date.now()/1000);
  const str=`POST\n/v1/identify\n${CFG.acrKey}\naudio\n1\n${ts}`;
  const enc=new TextEncoder();
  const ck=await crypto.subtle.importKey('raw',enc.encode(CFG.acrSecret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const sig=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.sign('HMAC',ck,enc.encode(str)))));

  const form=new FormData();
  form.append('sample',blob,'audio.webm');
  form.append('access_key',CFG.acrKey);
  form.append('data_type','audio');
  form.append('signature_version','1');
  form.append('signature',sig);
  form.append('sample_bytes',blob.size);
  form.append('timestamp',ts);

  log('Enviando a ACRCloud...');
  const res=await fetch(`https://${CFG.acrHost}/v1/identify`,{method:'POST',body:form});
  if(!res.ok)throw new Error('ACRCloud HTTP '+res.status);
  const data=await res.json();
  log('ACRCloud responde: código '+data.status?.code);

  if(data.status?.code===0&&data.metadata?.music?.length){
    const t=data.metadata.music[0];
    return{
      title:t.title,
      artist:t.artists?.[0]?.name||'Artista desconocido',
      ytVideoId:t.external_metadata?.youtube?.vid||null
    };
  }
  if(data.status?.code===1001)throw new Error('Sin música detectada');
  throw new Error('ACRCloud: '+data.status?.msg);
}

// ── YOUTUBE SEARCH — prioriza canales oficiales ──
async function searchYT(title,artist){
  // Usar título completo para máxima precisión
  const fullQ=encodeURIComponent(`${artist} ${title}`);
  const officialQ=encodeURIComponent(`${artist} ${title} official`);
  const vevoQ=encodeURIComponent(`${artist}VEVO ${title}`);

  const base=`https://www.googleapis.com/youtube/v3/search?type=video&videoCategoryId=10&key=${CFG.ytKey}`;

  const [r1,r2,r3]=await Promise.all([
    fetch(`${base}&part=snippet&q=${fullQ}&maxResults=5&order=relevance`).then(r=>r.json()),
    fetch(`${base}&part=snippet&q=${officialQ}&maxResults=5&order=viewCount`).then(r=>r.json()),
    fetch(`${base}&part=snippet&q=${vevoQ}&maxResults=3&order=relevance`).then(r=>r.json()),
  ]);

  const items=[...(r1.items||[]),...(r2.items||[]),...(r3.items||[])];
  if(!items.length){log('0 resultados YouTube');return null;}

  // Deduplicar
  const seen=new Set();
  const unique=items.filter(i=>{
    if(seen.has(i.id.videoId))return false;
    seen.add(i.id.videoId);return true;
  });

  log(`YouTube: ${unique.length} resultados únicos`);

  const scored=unique.map(i=>({
    id:i.id.videoId,
    s:scoreVid(i.snippet.title,i.snippet.channelTitle,title,artist)
  })).sort((a,b)=>b.s-a.s);

  log(`Mejor: score ${scored[0]?.s} — ${scored[0]?.id}`);
  return scored.slice(0,6).map(i=>i.id);
}

function scoreVid(snippetTitle,channelTitle,title,artist){
  const st=snippetTitle.toLowerCase();
  const ch=channelTitle.toLowerCase();
  const t=title.toLowerCase();
  const a=artist.toLowerCase();
  let p=0;

  // ★ Coincidencia exacta del título completo — máxima prioridad
  if(st.includes(t))                         p+=8;
  // Penalizar fuerte si el título NO está en el resultado
  else                                        p-=6;

  // ★ Canales oficiales
  if(ch.includes('vevo'))                    p+=10;
  if(ch===a||ch===a+' vevo')                 p+=8;
  if(ch.includes(a)&&ch.includes('vevo'))    p+=10;
  if(ch.includes(a)&&ch.includes('official'))p+=6;
  if(ch.includes(a))                         p+=4;
  if(ch.includes('records'))                 p+=2;
  if(ch.includes('music'))                   p+=1;

  // Artista en título
  if(st.includes(a))                         p+=4;

  // Palabras clave oficiales
  if(st.includes('official music video'))    p+=5;
  if(st.includes('official video'))          p+=4;
  if(st.includes('official'))                p+=2;
  if(st.includes('vevo'))                    p+=3;

  // ★ Penalizaciones fuertes
  if(st.includes('cover'))                   p-=10;
  if(st.includes('karaoke'))                 p-=10;
  if(st.includes('reaction'))                p-=10;
  if(st.includes('tutorial'))                p-=10;
  if(st.includes('how to'))                  p-=10;
  if(st.includes('lyrics')&&!st.includes('official'))p-=3;
  if(st.includes('remix')&&!ch.includes(a)) p-=5;
  if(st.includes('live')&&!st.includes('official'))  p-=4;
  if(st.includes('tik tok')||st.includes('tiktok'))  p-=8;
  if(st.includes('viral'))                   p-=6;

  return p;
}

// ── CHECK EMBEDDABLE ──
// ── PLAY VIDEO con fallback automático ──
let currentVideoIds=[];
let currentTitle='';
let currentArtist='';
let currentIdIndex=0;
let videoCheckTimer=null;

async function playVideo(videoIds,title,artist){
  if(!Array.isArray(videoIds))videoIds=[videoIds];
  currentVideoIds=videoIds;
  currentTitle=title;
  currentArtist=artist;
  currentIdIndex=0;
  tryNextVideo();
}

function tryNextVideo(){
  clearTimeout(videoCheckTimer);
  if(currentIdIndex>=currentVideoIds.length){
    log('Todos los videos bloqueados — pantalla anterior','warn');
    // Si había video anterior lo mantenemos, si no volvemos a listen
    if(!isVideoPlaying){
      showScreen('listen');
      startCycle();
    }
    return;
  }

  const videoId=currentVideoIds[currentIdIndex];
  log(`Cargando video ${currentIdIndex+1}/${currentVideoIds.length}: ${videoId}`);

  const frame=document.getElementById('yt-player');
  frame.src=`https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&playsinline=1`;

  // Mostrar video layer inmediatamente
  document.getElementById('video-layer').classList.add('playing');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

  // ★ Si en 5 segundos el iframe sigue mostrando error → siguiente video
  videoCheckTimer=setTimeout(()=>{
    // Verificar si el iframe tiene contenido visible
    // Si no hay respuesta del iframe en 5s lo consideramos bloqueado
    log('Timeout — probando siguiente video');
    currentIdIndex++;
    tryNextVideo();
  },5000);

  // Escuchar mensajes del iframe
  const handler=(e)=>{
    try{
      const d=typeof e.data==='string'?JSON.parse(e.data):e.data;
      if(d?.event==='onReady'||d?.event==='onStateChange'){
        // Video cargó correctamente
        if(d?.event==='onReady'||(d?.event==='onStateChange'&&d?.info===1)){
          clearTimeout(videoCheckTimer);
          window.removeEventListener('message',handler);
          onVideoLoaded();
        }
      }
      if(d?.event==='onError'){
        clearTimeout(videoCheckTimer);
        window.removeEventListener('message',handler);
        log(`Error ${d?.info} — siguiente video`,'warn');
        currentIdIndex++;
        tryNextVideo();
      }
    }catch(ex){}
  };
  window.addEventListener('message',handler);
  setTimeout(()=>window.removeEventListener('message',handler),8000);
}

function onVideoLoaded(){
  isVideoPlaying=true;
  const title=currentTitle;
  const artist=currentArtist;

  document.getElementById('last-song-title').textContent=`${artist} — ${title}`;
  document.getElementById('last-song').style.display='block';
  document.getElementById('vhud-title').textContent=title;
  document.getElementById('vhud-artist').textContent=artist;

  const hud=document.getElementById('video-hud');
  hud.classList.add('show');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>hud.classList.remove('show'),5000);

  document.getElementById('flash-title').textContent=title;
  document.getElementById('flash-artist').textContent=artist;
  const flash=document.getElementById('song-flash');
  flash.classList.add('show');
  setTimeout(()=>flash.classList.remove('show'),2500);

  log(`▶ ${artist} — ${title}`,'ok');
}

// Tap to show HUD
document.getElementById('video-layer').addEventListener('click',()=>{
  const hud=document.getElementById('video-hud');
  hud.classList.add('show');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>hud.classList.remove('show'),4000);
});

// ── TOAST ──
let toastT;
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show '+(type||'');
  clearTimeout(toastT);toastT=setTimeout(()=>el.className='',4000);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
